<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
</head>

<body style="margin:0; padding:0; background-color:#f2f3f8; font-family:Arial, sans-serif;">

<table width="100%" bgcolor="#f2f3f8" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="500" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; margin:40px 0; border-radius:10px; padding:30px; text-align:center;">

                <!-- Header -->
                <tr>
                    <td>
                        <h2 style="color:#333;">🔐 Email Verification</h2>
                        <p style="color:#666;">Use the OTP below to verify your email</p>
                    </td>
                </tr>

                <!-- OTP Box -->
                <tr>
                    <td style="padding:20px 0;">
                        <div style="
                            display:inline-block;
                            padding:15px 30px;
                            font-size:28px;
                            letter-spacing:5px;
                            font-weight:bold;
                            color:#ffffff;
                            background:#4CAF50;
                            border-radius:8px;">

                            <span th:text="${otp}">123456</span>

                        </div>
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td>
                        <p style="color:#555;">
                            This OTP is valid for <b>5 minutes</b>.
                        </p>

                        <p style="color:#999; font-size:14px;">
                            Do not share this OTP with anyone.
                        </p>
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:20px 0;">
                        <hr style="border:none; border-top:1px solid #eee;">
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td>
                        <p style="font-size:12px; color:#aaa;">
                            If you did not request this, please ignore this email.
                        </p>

                        <p style="font-size:12px; color:#aaa;">
                            © 2026 Your Company. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
